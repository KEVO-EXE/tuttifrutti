
name: Publicar Tutti Frutti en InfinityFree

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  deploy:
    name: Desplegar Tutti Frutti
    runs-on: ubuntu-latest

    steps:
      - name: Obtener archivos de GitHub
        uses: actions/checkout@v4

      - name: Probar conexion y despliegue FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp

          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}

          dry-run: false
          dangerous-clean-slate: false
          log-level: standard

          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.vscode/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/conexion.php
            **/README.md
            **/*.doc
            **/*.docx
            **/*.pdf
            **/*.sql
